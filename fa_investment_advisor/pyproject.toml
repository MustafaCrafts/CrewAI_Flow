[project]
name = "fa_investment_advisor"
version = "0.1.0"
description = "fa_investment_advisor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
fa_investment_advisor = "fa_investment_advisor.main:run"
run_crew = "fa_investment_advisor.main:run"
train = "fa_investment_advisor.main:train"
replay = "fa_investment_advisor.main:replay"
test = "fa_investment_advisor.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
