[project]
name = "project2"
version = "0.1.0"
description = "Project2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0",
    "litellm>=1.59.8",
]

[project.scripts]
kickoff = "project2.main:kickoff"
plot = "project2.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
